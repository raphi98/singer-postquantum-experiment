# Ein Worker: weniger Scheduling-Streuung, gemessen werden ohnehin nur serielle Handshakes.
worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;
daemon off;

events {
    worker_connections 1024;
}

http {
    # Zeile pro Request. Dient der Kontrolle, dass wirklich die erzwungene Gruppe
    # verhandelt und keine Session wiederaufgenommen wurde.
    log_format lab '$arg_id\t$msec\t$ssl_protocol\t$ssl_cipher\t$ssl_curve\t$ssl_session_reused';
    access_log /var/log/lab/access.tsv lab;

    server {
        listen 443 ssl;
        server_name lab-server;

        ssl_certificate     /etc/nginx/certs/chain.pem;
        ssl_certificate_key /etc/nginx/certs/leaf.key;

        ssl_protocols TLSv1.3;
        ssl_ecdh_curve X25519MLKEM768:X25519;

        # Keine Wiederaufnahme auf Serverseite (zusätzlich zum neuen curl-Prozess).
        ssl_session_cache off;
        ssl_session_tickets off;

        keepalive_timeout 0;

        location / {
            default_type text/plain;
            return 200 "ok\n";
        }
    }
}
